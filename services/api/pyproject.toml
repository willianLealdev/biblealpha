[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "biblealpha-api"
version = "0.1.0"
description = "API da plataforma BibleAlpha"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "httpx>=0.28",
  "redis>=5.2",
  "celery>=5.4",
  "anthropic>=1.15",
  "python-docx>=1.1",
  "fpdf2>=2.8",
  "python-pptx>=1.0",
  "cryptography>=43",
  "stripe>=12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pgserver>=0.1.4",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"tests/test_original.py" = ["E501"]
"alembic/versions/*" = ["E501"]
# Instruções da IA em texto corrido
"app/ai/prompts.py" = ["E501"]
"app/devotional/prompts.py" = ["E501"]
"app/sermon/ai.py" = ["E501"]
"app/sermon/schema.py" = ["E501"]
"app/ai/quiz.py" = ["E501"]
"app/visual/service.py" = ["E501"]
"app/screens/service.py" = ["E501"]
# Caminhos dos arquivos do STEPBible e tabela de livros
"app/bible/original.py" = ["E501"]
