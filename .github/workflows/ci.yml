name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: biblealpha
          POSTGRES_PASSWORD: biblealpha
          POSTGRES_DB: biblealpha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U biblealpha" --health-interval 5s --health-retries 10
    env:
      BA_TEST_DATABASE_URL: postgresql+asyncpg://biblealpha:biblealpha@localhost:5432/biblealpha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - name: Migrações em dia com os modelos
        run: alembic upgrade head && alembic check
        env:
          BA_DATABASE_URL: postgresql+asyncpg://biblealpha:biblealpha@localhost:5432/biblealpha_test
      - run: pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - run: npm ci
      - name: Catálogo de livros igual ao do backend
        run: python3 ../../tools/sync_books.py --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
